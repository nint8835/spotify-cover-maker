name: Publish Site
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event.repository.fork == false
    steps:
      - uses: actions/checkout@v7.0.1 # zizmor: ignore[unpinned-uses] -- Pinned by actions.lock.
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0 # zizmor: ignore[unpinned-uses] -- Pinned by actions.lock.
        with:
          python-version: 3.x
      - uses: actions/cache@v6.1.0 # zizmor: ignore[unpinned-uses] -- Pinned by actions.lock.
        with:
          key: ${{ github.ref }}
          path: site/.cache
      - run: sudo apt-get install pngquant 
      - run: pip install -r requirements.txt
        working-directory: site
      - run: mkdocs gh-deploy --force
        working-directory: site
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: credential.helper
          GIT_CONFIG_VALUE_0: '!gh auth git-credential'
