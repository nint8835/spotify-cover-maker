name: Release
on:
  push:
    tags:
      - 'v*'
jobs:
  release:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1 # zizmor: ignore[unpinned-uses] -- Pinned by actions.lock.
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: git fetch --force --tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: credential.helper
          GIT_CONFIG_VALUE_0: '!gh auth git-credential'
      - uses: actions/setup-go@v7.0.0 # zizmor: ignore[unpinned-uses] -- Pinned by actions.lock.
        with:
          go-version-file: 'go.mod'
          cache: false
      - uses: goreleaser/goreleaser-action@v7.3.0 # zizmor: ignore[unpinned-uses] -- Pinned by actions.lock.
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
